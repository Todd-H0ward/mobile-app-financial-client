name: CI

# Everything a PR needs before review: types, tests, coverage, format.
# No Android SDK, no credentials — see build-apk.yml for the release.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Only the autofix job may write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test + coverage (economy / minigame)
        run: pnpm test:coverage

      - name: Lint / format
        run: pnpm lint

  # Same-repo PRs only: apply Biome and push. Forks / main stay read-only
  # and must land already clean (check job fails on format drift).
  autofix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # Needed so the bot can push to the PR branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply Biome
        run: pnpm format

      - name: Commit Biome fixes
        run: |
          if git diff --quiet; then
            echo 'No Biome changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src plugins biome.json
          git commit -m "$(cat <<'EOF'
          style: apply biome format and import order

          EOF
          )"
          git push
