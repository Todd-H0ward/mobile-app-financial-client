<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0e2016;color:#9ef0a8;font:18px sans-serif}img{width:220px;margin:8px;border:3px solid #3c4a40}canvas{display:none}</style><h1>Кадры утверждённого концепта</h1><div id="status">Рендер</div><script type="module">
import * as T from 'https://esm.sh/three@0.160.0';import{OutlineEffect}from'https://esm.sh/three@0.160.0/examples/jsm/effects/OutlineEffect.js';import{composeShot,LOOKS,COATS}from'./scene.mjs';
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.outputColorSpace=T.SRGBColorSpace;const fx=new OutlineEffect(r,{defaultThickness:.0045,defaultColor:[.13,.1,.09]});
COATS.forest={body:'#A9B89C',dark:'#253B2B',accent:'#9EF0A8',glow:'#9EF0A8'};COATS.rust={body:'#B98265',dark:'#3C2D27',accent:'#F2C879',glow:'#F2C879'};
for(const shot of ['walk','low','name','edge','fall','bottom','climb','exit'])for(const coat of Object.keys(COATS))for(const ears of ['floppy','blade','radar'])for(const face of ['dots','happy','wide']){const{scene,cam}=await composeShot(shot,shot==='duo'?LOOKS.ink:LOOKS.dusk,{coat,ears,face,catFace:'glow',stage:['climb','exit'].includes(shot)?3:0});const w=768,h=1024;cam.aspect=w/h;cam.updateProjectionMatrix();r.setSize(w,h,false);fx.render(scene,cam);const img=document.createElement('img');img.id=`${shot==='exit'?'reunion':shot}-${coat}-${ears}-${face}`;img.src=r.domElement.toDataURL('image/jpeg',.82);const link=document.createElement('a');link.download=img.id+(img.src.startsWith('data:image/png')?'.png':'.jpg');link.href=img.src;link.append(img);document.body.append(link);document.querySelector('#status').textContent=img.id;await new Promise(resolve=>setTimeout(resolve,0));scene.traverse(o=>{if(o.geometry)o.geometry.dispose()});}
document.querySelector('#status').textContent='Готово';r.dispose();
</script>
