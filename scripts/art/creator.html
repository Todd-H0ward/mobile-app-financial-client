<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0e2016;color:#9ef0a8;font:18px sans-serif}img{width:180px;margin:4px}canvas{display:none}</style><h1>Знакомство и загрузка</h1><div id="status">Рендер</div><script type="module">
import * as T from 'https://esm.sh/three@0.160.0';import{OutlineEffect}from'https://esm.sh/three@0.160.0/examples/jsm/effects/OutlineEffect.js';import{composeShot,LOOKS,COATS}from'./scene.mjs';
COATS.forest={body:'#A9B89C',dark:'#253B2B',accent:'#9EF0A8',glow:'#9EF0A8'};COATS.rust={body:'#B98265',dark:'#3C2D27',accent:'#F2C879',glow:'#F2C879'};
const r=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.outputColorSpace=T.SRGBColorSpace;const fx=new OutlineEffect(r,{defaultThickness:.0045,defaultColor:[.13,.1,.09]});
function save(id,type='jpeg'){const img=document.createElement('img');img.id=id;img.src=r.domElement.toDataURL('image/'+type,.86);const link=document.createElement('a');link.download=img.id+(img.src.startsWith('data:image/png')?'.png':'.jpg');link.href=img.src;link.append(img);document.body.append(link);fetch('/save?name='+encodeURIComponent(id),{method:'POST',body:img.src}).catch(()=>{});}
for(const [kind,values] of [['coat',Object.keys(COATS)],['ears',['floppy','blade','radar']],['face',['dots','happy','wide']]])for(const value of values){const{scene,cam}=await composeShot(kind==='coat'?'dog':`${kind}:${value}`,LOOKS.dusk,{coat:kind==='coat'?value:'factory',ears:'floppy',face:'dots'});cam.aspect=1.2;cam.updateProjectionMatrix();r.setSize(360,300,false);fx.render(scene,cam);save(`${kind}-${value}`);scene.traverse(o=>{if(o.geometry)o.geometry.dispose()});}
document.querySelector('#status').textContent='Готово';fetch('/done',{method:'POST'}).catch(()=>{});r.dispose();
</script>
